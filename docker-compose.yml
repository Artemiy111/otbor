services:
  postgres:
    image: postgres:18-alpine
    container_name: otbor-postgres
    environment:
      POSTGRES_USER: otbor
      POSTGRES_PASSWORD: otbor
      POSTGRES_DB: otbor
    ports:
      - "55432:5432"
    volumes:
      # Postgres 18 keeps the cluster in a versioned subdirectory; the mount
      # must be the parent so `pg_upgrade --link` can cross the boundary.
      - otbor-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otbor -d otbor"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Drizzle Studio для просмотра всех таблиц: http://local.drizzle.studio
  # (сам Studio слушает 4983, страница открывается через local.drizzle.studio).
  # Запуск: `bun run db:studio`. Профиль, чтобы `db:up` его не поднимал.
  drizzle-studio:
    image: oven/bun:1-alpine
    container_name: otbor-drizzle-studio
    profiles: ["studio"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://otbor:otbor@postgres:5432/otbor
    volumes:
      - ./:/app:ro
      - drizzle-kit-cache:/root/.bun/install/cache
    ports:
      - "127.0.0.1:4983:4983"
    command: >
      sh -c "mkdir -p /tmp/kit && cd /tmp/kit && bun add drizzle-kit@1.0.0-rc.5 drizzle-orm@1.0.0-rc.5 >/dev/null
      && cd /app && /tmp/kit/node_modules/.bin/drizzle-kit studio --host 0.0.0.0 --port 4983"

volumes:
  otbor-pgdata:
  drizzle-kit-cache:
