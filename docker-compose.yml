services:
  postgres:
    image: postgres:18-alpine
    container_name: otbor-postgres
    environment:
      POSTGRES_USER: otbor
      POSTGRES_PASSWORD: otbor
      POSTGRES_DB: otbor
    ports:
      - "55432:5432"
    volumes:
      - otbor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otbor -d otbor"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  otbor-pgdata:
