# Mimir в монолитном режиме (все компоненты в одном процессе), блоки на
# локальном диске. Один арендатор, одна реплика: это локальный стек.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  compactor_blocks_retention_period: 30d
  # Экземпляры из metrics-generator Tempo.
  max_global_exemplars_per_user: 100000
  # service.name и service.version становятся обычными метками серий.
  promote_otel_resource_attributes: service.name,service.version,deployment.environment.name

usage_stats:
  enabled: false
